 const pool=oldQuestions.filter(x=>x.c!==null); // three old items have no marked answer key
 const random28=shuffle(pool.slice()).slice(0,28).map(x=>({...x,type:'text'}));
 questions=shuffle(random28.concat(fixedQuestions.map(x=>({...x}))));
 answers=Array(questions.length).fill(null);idx=0;started=true;endAt=Date.now()+120*60*1000;
 document.getElementById('login').classList.add('hidden');document.getElementById('test').classList.remove('hidden');render();timerHandle=setInterval(tick,250);tick();
}
function tick(){if(!started)return;let ms=Math.max(0,endAt-Date.now());let s=Math.floor(ms/1000);let h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60);s%=60;document.getElementById('timer').textContent=[h,m,s].map((x,i)=>String(x).padStart(i?2:2,'0')).join(':');if(ms<=0)finishTest(true)}
function render(){
 const x=questions[idx];document.getElementById('progress').textContent=`Question ${idx+1} of ${questions.length}`;
 const area=document.getElementById('questionArea');area.innerHTML='';
 if(x.type==='image'){
   const p=document.createElement('p');p.className='small';p.textContent=x.label;area.appendChild(p);
   const im=document.createElement('img');im.className='imageq';im.src='assets/'+x.img;im.alt=x.label;area.appendChild(im);
 } else {
   const q=document.createElement('div');q.className='question';q.textContent=x.q;area.appendChild(q);
 }
 const opts=document.createElement('div');
 const letters=['A','B','C','D'];
 if(x.type==='image'){
   letters.forEach((L,j)=>{const b=document.createElement('button');b.className='option';b.textContent=L;b.onclick=()=>choose(j);if(answers[idx]===j)b.classList.add('selected');opts.appendChild(b)});
 } else {
   x.a.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=letters[j]+') '+v;b.onclick=()=>choose(j);if(answers[idx]===j)b.classList.add('selected');opts.appendChild(b)});
 }
 area.appendChild(opts);document.getElementById('prev').disabled=idx===0;document.getElementById('next').textContent=idx===questions.length-1?'Finish':'Next';
}
function choose(j){answers[idx]=j;render()}
function nextQ(){if(idx<questions.length-1){idx++;render()}else finishTest(false)}
function prevQ(){if(idx>0){idx--;render()}}
function finishTest(auto){if(!started)return;started=false;clearInterval(timerHandle);let score=0,wrong=[];questions.forEach((x,i)=>{if(answers[i]===x.c)score++;else wrong.push({x,chosen:answers[i]})});document.getElementById('test').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let html=`<div class="result"><b>Score: ${score} / 50</b><br>Correct: ${score}<br>Wrong: ${wrong.length}</div>`;if(auto)html+='<p><b>Time finished — test submitted automatically.</b></p>';if(wrong.length){html+='<h3>Wrong Questions</h3>';wrong.forEach((w,k)=>{const x=w.x;html+=`<div class="wrong"><b>Question ${x.n}</b><br>`+(x.type==='text'?x.q:'<img class="imageq" src="assets/'+x.img+'" alt="Question '+x.n+'">')+`<br>Your answer: <b>${w.chosen===null?'Not answered':['A','B','C','D'][w.chosen]}</b><br>Correct answer: <b>${['A','B','C','D'][x.c]}</b></div>`})}else html+='<p><b>Excellent — no wrong answers.</b></p>';html+='<p class="small">The 28-question random section was selected from the answer-keyed questions in the original 115-question pool. The three original items without a marked answer key were not selected so the final score remains valid out of 50.</p>';document.getElementById('resultBody').innerHTML=html}
</script></body></html>
